syntax = "proto3";

package gateway;

option go_package = "gateway/proto-go/gateway";


message EventRequest {
    uint32 client_id = 1;
}

message EventResponse {
    string event_type = 1;
    uint32 auction_id = 2;
    string data = 3;
}


message AuctionSubscribeRequest {
    uint32 client_id = 1;
    repeated uint32 auction_id = 2;
}

message AuctionSubscribeResponse {
    bool success = 1;
}


message AuctionUnsubscribeRequest {
    uint32 client_id = 1;
    repeated uint32 auction_id = 2;
}

message AuctionUnsubscribeResponse {
    bool success = 1;
}

service EventStream {
    rpc StreamStart(EventRequest) returns (stream EventResponse);
    rpc AuctionSubscribe(AuctionSubscribeRequest) returns (AuctionSubscribeResponse);
    rpc AuctionUnsubscribe(AuctionUnsubscribeRequest) returns (AuctionUnsubscribeResponse);
}



message Auction {
    uint32 id = 1;
    string item = 2;
    uint64 start_timestamp = 3;
    uint64 end_timestamp = 4;
    bool status = 5;
}


service AuctionService {
  rpc GetActiveAuctions(GetActiveAuctionsRequest) returns (GetActiveAuctionsResponse);
  rpc CreateAuction(CreateAuctionRequest) returns (CreateAuctionResponse);
}

message GetActiveAuctionsRequest {}

message GetActiveAuctionsResponse {
  repeated Auction auctions = 1;
}

message CreateAuctionRequest {
  string item_name = 1;
  uint64 start_timestamp = 2;
  uint64 end_timestamp = 3;
}

message CreateAuctionResponse {
  bool success = 1;
}


service BidService {
  rpc CreateBid(CreateBidRequest) returns (CreateBidResponse);
}

message CreateBidRequest {
  uint32 auction_id = 1;
  uint32 client_id = 2;
  double value = 3;
  string signature = 4;
  string public_key = 5;
  bool valid = 6;
}

message CreateBidResponse {
  bool success = 1;
}
